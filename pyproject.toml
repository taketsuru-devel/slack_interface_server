[project]
name = "shared-slack-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "slack-bolt>=1.21",
    "flask>=3.1",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
